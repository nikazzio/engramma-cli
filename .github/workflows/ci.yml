name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck zsh
      - run: make lint
      - run: make test
      - name: Verify source distribution
        run: |
          make dist
          cd dist
          sha256sum --check SHA256SUMS
          version="$(cat ../VERSION)"
          tar -xzf "engramma-$version.tar.gz"
          test "$("./engramma-$version/bin/sync.sh" --version)" = "Engramma $version"

  contracts:
    name: Contracts and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned development tools
        run: python3 scripts/devtools.py install
      - run: make check-tools
      - name: Scan repository history
        run: .tools/bin/gitleaks git . --redact --no-banner
