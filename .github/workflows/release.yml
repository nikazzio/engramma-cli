name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching v<VERSION>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/check-release.sh
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck zsh
      - name: Install pinned development tools
        run: python3 scripts/devtools.py install
      - run: make check
      - run: make dist
      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --generate-notes "${prerelease[@]}"
